<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OI CONNECT | Concepto NORYNET</title><meta name="description" content="Demostración conceptual de una experiencia comercial conectada para Oi El Salvador."><style>:root{--o:#6633a6;--ink:#171b27;--muted:#707786;--line:#e5e7ec;--bg:#f7f8fa}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#fff}button{font:inherit;cursor:pointer}.shell{min-height:100vh;display:flex;flex-direction:column}.top{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5vw;position:relative;background:#fff;z-index:5}.brand{display:flex;align-items:center;gap:10px}.brand b{font-size:30px;color:var(--o);font-style:italic;letter-spacing:-4px}.brand span{font-size:10px;letter-spacing:.16em;font-weight:800}.nav{display:flex;gap:4px}.nav button,.hamb{border:0;background:transparent;padding:10px;border-radius:9px;font-size:11px;font-weight:700}.nav button.active{background:#f0edf4}.tools{display:flex;align-items:center;gap:8px}.sim{font-size:9px;font-weight:700;color:#5e328e;background:#f1eaf8;padding:7px 10px;border-radius:20px}.hamb{display:none}.mobile-nav{display:none}.main{flex:1}.cover{min-height:calc(100vh - 105px);display:grid;grid-template-columns:1fr 1fr;gap:35px;padding:7vw;background:radial-gradient(circle at 85% 15%,#f1eaf8,transparent 38%)}.cover section:first-child{align-self:center}.pill{display:inline-flex;background:#f6f1fa;color:#5e328e;border-radius:20px;padding:7px 10px;font-size:9px;font-weight:700}.cover h1,.closing h1{font-size:clamp(48px,6vw,84px);line-height:.95;letter-spacing:-.06em;margin:14px 0}.cover em,.closing em{font-style:normal;color:var(--o)}.lead{font-size:18px;line-height:1.55;color:#626a79;max-width:590px}.primary,.outline{border-radius:11px;height:49px;padding:0 18px;font-weight:800}.primary{border:0;color:#fff;background:linear-gradient(135deg,#8152bd,#542389)}.outline{border:1px solid var(--line);background:#fff}.verbs{display:flex;gap:20px;border-top:1px solid var(--line);margin-top:34px;padding-top:20px}.verbs span{font-size:10px}.stage{display:grid;place-items:center;min-height:440px;position:relative}.orbit{position:absolute;border:1px dashed #e1d8e7;border-radius:50%}.orbit.a{width:330px;height:330px}.orbit.b{width:465px;height:465px}.core{width:170px;height:170px;border-radius:50%;background:var(--o);color:#fff;display:grid;place-items:center;z-index:2}.core b{font-size:60px;font-style:italic}.float{position:absolute;z-index:3;background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 13px;box-shadow:0 15px 35px #2222}.float b,.float small{display:block;font-size:9px}.float small{color:var(--muted)}.f1{top:12%;left:0}.f2{top:22%;right:0}.f3{bottom:10%;left:3%}.page{min-height:calc(100vh - 105px);padding:45px 8vw;background:#fafbfc}.page-head{display:flex;justify-content:space-between;align-items:end}.page-head h1{font-size:clamp(30px,4vw,44px);margin:4px 0}.page-head p{color:var(--muted)}.advisor{max-width:1050px;margin:auto}.progress{height:5px;background:#e9e9ee;border-radius:99px;margin:20px 0 30px;overflow:hidden}.progress i{display:block;height:100%;background:var(--o)}.question,.process{background:#fff;border:1px solid var(--line);border-radius:24px;padding:clamp(22px,4vw,40px);box-shadow:0 18px 50px #2221}.question h2{font-size:clamp(26px,3vw,36px);margin:6px 0}.question>p,.process>p{color:var(--muted)}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:22px}.opt{border:1px solid var(--line);border-radius:14px;background:#fff;min-height:86px;padding:16px;text-align:left}.opt.chosen{border-color:var(--o);background:#f7f2fb}.opt b,.opt small{display:block}.opt small{font-size:9px;color:var(--muted);margin-top:5px}.q-actions{display:flex;justify-content:space-between;gap:10px;margin-top:25px}.phones{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}.phone-card{border:1px solid var(--line);background:#fff;border-radius:20px;padding:18px}.phone-card.best{border:2px solid var(--o)}.phone-visual{width:95px;height:165px;border:4px solid #292d36;border-radius:20px;margin:18px auto;background:#8fc5d1}.phone-card:nth-child(2) .phone-visual{background:#9bc844}.phone-card:nth-child(3) .phone-visual{background:#9572d3}.phone-card h3{font-size:22px;margin:5px 0}.phone-card p{font-size:11px;color:var(--muted)}.center{min-height:calc(100vh - 105px);background:var(--bg);display:grid;place-items:center;padding:20px}.process{width:min(100%,570px);text-align:center}.ok{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:#e5f6eb;color:#27884b;font-weight:900;margin:auto;font-size:26px}.steps{display:grid;gap:7px;text-align:left;margin:22px 0}.steps div{border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff;display:flex;align-items:center;justify-content:space-between}.handoff{padding:13px;border-radius:12px;background:#f2ebf8;text-align:left}.workspace{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 105px)}.side{border-right:1px solid var(--line);padding:25px 15px;display:flex;flex-direction:column;gap:6px}.side button{border:0;background:transparent;padding:10px;text-align:left}.side button.active{background:#f1eaf8;color:var(--o)}.work{background:#f5f6f8;padding:32px 4vw}.work h1{font-size:40px;margin:5px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}.stats article,.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px}.stats b{display:block;font-size:24px}.stats small{font-size:9px;color:var(--muted)}.leads{background:#fff;border-radius:14px;overflow:hidden}.lead-row{display:grid;grid-template-columns:1.2fr 1fr auto;gap:10px;align-items:center;padding:13px;border-bottom:1px solid var(--line)}.lead-row b,.lead-row small{display:block}.lead-row small{font-size:9px;color:var(--muted)}.status-btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px;font-size:10px}.command{background:#111421;color:#fff}.command .work{background:#111421}.command .card,.command .stats article{background:#1b1f2e;border-color:#2c3143}.command .stats small{color:#aeb4c4}.metrics{grid-template-columns:repeat(4,1fr)}.dash-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:10px}.funnel div{margin:7px 0;padding:10px;border-radius:6px;background:#7357b6}.funnel div:nth-child(2){background:#388092;width:82%}.funnel div:nth-child(3){background:#a87438;width:62%}.funnel div:nth-child(4){background:#668b3b;width:42%}.campaigns div{padding:10px 0;border-bottom:1px solid #303444;font-size:11px;display:flex;justify-content:space-between}.closing{min-height:calc(100vh - 105px);display:grid;place-items:center;text-align:center;padding:40px}.closing section{max-width:850px}.closing p{color:var(--muted)}.pilot{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);margin:25px 0}.pilot div{padding:14px;text-align:left}.pilot b,.pilot small{display:block;font-size:9px}.footer{border-top:1px solid var(--line);text-align:center;color:#858b97;padding:16px;font-size:10px}@media(max-width:850px){.nav{display:none}.hamb{display:block}.mobile-nav.open{display:grid;position:absolute;top:67px;left:0;right:0;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 16px 28px #17132122;padding:10px 14px 14px}.mobile-nav button{border:0;border-bottom:1px solid #eee8f3;background:#fff;text-align:left;padding:14px;font-weight:700}.cover{grid-template-columns:1fr}.stage{min-height:340px}.options,.phones{grid-template-columns:1fr}.workspace{grid-template-columns:1fr}.side{display:none}.dash-grid{grid-template-columns:1fr}.pilot{grid-template-columns:1fr 1fr}}@media(max-width:550px){.cover,.page{padding:34px 16px}.cover h1{font-size:47px}.verbs{display:grid;grid-template-columns:1fr 1fr}.orbit.a{width:200px;height:200px}.orbit.b{width:290px;height:290px}.core{width:115px;height:115px}.core b{font-size:42px}.stats,.metrics{grid-template-columns:1fr 1fr}.lead-row{grid-template-columns:1fr auto}.lead-row>span:nth-child(2){display:none}.pilot{grid-template-columns:1fr}.q-actions{flex-direction:column}.q-actions button{width:100%}}</style></head><body><div id="app"></div><script>const app=document.getElementById('app');let view='home',menu=false,step=0,answers=[],leadStatus='Nuevo';const nav=[['advisor','Encontrar teléfono'],['sales','Seguimiento comercial'],['command','Resultados ejecutivos']];const header=()=>`<header class='top'><div class='brand'><b>oi</b><span>CONNECT</span></div><nav class='nav'>${nav.map(([v,l])=>`<button data-view='${v}' class='${view===v?'active':''}'>${l}</button>`).join('')}</nav><div class='tools'><span class='sim'>Simulación demostrativa</span><button class='hamb' id='hamb'>☰ Menú</button></div><div class='mobile-nav ${menu?'open':''}'>${nav.map(([v,l])=>`<button data-view='${v}'>${l}</button>`).join('')}</div></header>`;const footer=()=>`<footer class='footer'>Concepto desarrollado para Oi El Salvador por NORYNET. Demostración conceptual. No constituye un servicio oficial de Oi.</footer>`;const home=()=>`<main class='main'><div class='cover'><section><span class='pill'>OI CONNECT · CONCEPTO COMERCIAL</span><h1>De la publicidad a la <em>solicitud.</em><br>De la solicitud a la <em>venta.</em></h1><p class='lead'>Una capa de captura, atribución y seguimiento para hacer medible el camino entre interés y venta.</p><button class='primary' data-view='advisor'>PROBAR EXPERIENCIA →</button><div class='verbs'><span>✓ CAPTAR</span><span>✓ ATRIBUIR</span><span>✓ DAR SEGUIMIENTO</span><span>✓ MEDIR</span></div></section><section class='stage'><div class='orbit a'></div><div class='orbit b'></div><div class='core'><b>oi</b></div><div class='float f1'><b>Meta Ads</b><small>Campaña identificada</small></div><div class='float f2'><b>BTL · Santa Tecla</b><small>Origen atribuido</small></div><div class='float f3'><b>Lead comercial</b><small>Seguimiento activo</small></div></section></div></main>`;const qs=[{q:'¿Para qué usás más tu teléfono?',o:[['Trabajo','Correo, llamadas y productividad'],['Redes y fotos','Contenido y cámara'],['Entretenimiento','Video, juegos y batería']]},{q:'¿Qué es lo más importante para vos?',o:[['Cámara','Fotos y video'],['Batería','Duración durante todo el día'],['Rendimiento','Velocidad y multitarea']]},{q:'¿Qué rango de presupuesto preferís?',o:[['Accesible','Priorizar valor'],['Intermedio','Equilibrio'],['Premium','Mejor experiencia disponible']]}];function advisor(){if(step>=qs.length)return recs();const q=qs[step];return `<main class='page'><div class='advisor'><div class='page-head'><div><small>OI GO · PASO ${step+1} DE 3</small><h1>Encontrá tu próximo teléfono</h1><p>Un ejemplo de captura personalizada de intención comercial.</p></div></div><div class='progress'><i style='width:${(step+1)*33.3}%'></i></div><section class='question'><h2>${q.q}</h2><p>Elegí la opción que más se parece a vos.</p><div class='options'>${q.o.map(([a,b],i)=>`<button class='opt ${answers[step]===a?'chosen':''}' data-opt='${i}'><b>${a}</b><small>${b}</small></button>`).join('')}</div><div class='q-actions'><button class='outline' id='back'>${step===0?'VOLVER AL INICIO':'ATRÁS'}</button><button class='primary' id='next' ${answers[step]?'':'disabled'}>CONTINUAR →</button></div></section></div></main>`}function recs(){return `<main class='page'><div class='advisor'><div class='page-head'><div><small>OI GO · RECOMENDACIÓN</small><h1>Opciones para vos</h1><p>Recomendación simulada según tus respuestas.</p></div></div><div class='phones'><article class='phone-card best'><div class='phone-visual'></div><small>MEJOR COINCIDENCIA</small><h3>Samsung Galaxy A56</h3><p>Buen equilibrio entre cámara, rendimiento y batería.</p><button class='primary' data-phone='1'>QUIERO CONOCER MÁS</button></article><article class='phone-card'><div class='phone-visual'></div><h3>Honor X8c</h3><p>Ligero, gran pantalla y excelente relación valor/precio.</p><button class='primary' data-phone='1'>QUIERO CONOCER MÁS</button></article><article class='phone-card'><div class='phone-visual'></div><h3>Motorola Edge</h3><p>Experiencia fluida y diseño premium.</p><button class='primary' data-phone='1'>QUIERO CONOCER MÁS</button></article></div></div></main>`}const process=()=>`<main class='center'><section class='process'><div class='ok'>✓</div><h1>Interés registrado</h1><p>Así se vería la trazabilidad comercial de esta interacción.</p><div class='steps'><div><b>Identificando origen</b><span>✓</span></div><div><b>Asociando campaña</b><span>✓</span></div><div><b>Registrando interés</b><span>✓</span></div><div><b>Preparando seguimiento</b><span>✓</span></div></div><div class='handoff'><b>Oportunidad simulada</b><br><small>Producto: Samsung Galaxy A56 · Origen: Campaña Meta · Estado: Nuevo</small></div><button class='primary' data-view='sales'>VER EL LADO COMERCIAL →</button></section></main>`;const sales=()=>`<main class='workspace'><aside class='side'><b>OI SALES</b><button class='active'>Oportunidades</button><button>Seguimientos</button><button>Campañas</button></aside><section class='work'><small>OI SALES · DEMOSTRACIÓN</small><h1>Seguimiento comercial</h1><p>Datos simulados con fines demostrativos.</p><div class='stats'><article><small>OPORTUNIDADES</small><b>48</b></article><article><small>CONTACTADOS</small><b>31</b></article><article><small>CONVERTIDOS</small><b>12</b></article></div><div class='leads'><div class='lead-row'><span><b>María López</b><small>Samsung Galaxy A56</small></span><span><b>Meta Ads</b><small>Campaña Septiembre</small></span><button class='status-btn' id='status'>${leadStatus}</button></div><div class='lead-row'><span><b>Carlos Méndez</b><small>Honor X8c</small></span><span><b>BTL Santa Tecla</b><small>Punto de activación</small></span><button class='status-btn'>En seguimiento</button></div><div class='lead-row'><span><b>Ana Rodríguez</b><small>Motorola Edge</small></span><span><b>Tienda aliada</b><small>Partner retail</small></span><button class='status-btn'>Solicitud</button></div></div><div style='margin-top:20px'><button class='primary' data-view='command'>VER RESULTADOS EJECUTIVOS →</button></div></section></main>`;const command=()=>`<main class='workspace command'><aside class='side'><b>OI COMMAND</b><button>Resumen</button><button class='active'>Campañas</button><button>Conversión</button></aside><section class='work'><small>OI COMMAND · DATOS SIMULADOS</small><h1>Resultados ejecutivos</h1><div class='stats metrics'><article><small>OPORTUNIDADES</small><b>126</b></article><article><small>CONTACTADOS</small><b>84</b></article><article><small>SOLICITUDES</small><b>41</b></article><article><small>CONVERSIONES</small><b>23</b></article></div><div class='dash-grid'><article class='card funnel'><h3>Embudo comercial</h3><div>126 · Interés</div><div>84 · Contactados</div><div>41 · Solicitud</div><div>23 · Conversión</div></article><article class='card campaigns'><h3>Rendimiento por campaña</h3><div><span>Meta · Septiembre</span><b>34 oportunidades</b></div><div><span>BTL · Santa Tecla</span><b>27 oportunidades</b></div><div><span>Tienda aliada</span><b>19 oportunidades</b></div><div><span>Perifoneo</span><b>11 oportunidades</b></div></article></div><div style='margin-top:20px'><button class='primary' data-view='close'>¿QUÉ PASARÍA AHORA? →</button></div></section></main>`;const close=()=>`<main class='closing'><section><small>DE DEMO A PILOTO</small><h1>Esto puede convertirse en una plataforma real para <em>Oi.</em></h1><p>NORYNET puede adaptar OI CONNECT a los procesos, campañas y sistemas existentes de Oi, empezando por un piloto controlado.</p><div class='pilot'><div><b>1. PILOTO</b><small>Campaña o zona controlada</small></div><div><b>2. MEDICIÓN</b><small>Origen → oportunidad → resultado</small></div><div><b>3. INTEGRACIÓN</b><small>Con sistemas existentes</small></div><div><b>4. ESCALA</b><small>Más canales y puntos</small></div></div><button class='primary'>PROPONER UN PILOTO →</button><button class='outline' data-view='home'>REINICIAR DEMO</button></section></main>`;function render(){let body=view==='home'?home():view==='advisor'?advisor():view==='process'?process():view==='sales'?sales():view==='command'?command():close();app.innerHTML=`<div class='shell'>${header()}${body}${footer()}</div>`;bind()}function bind(){document.querySelectorAll('[data-view]').forEach(el=>el.onclick=()=>{view=el.dataset.view;menu=false;if(view==='advisor'){step=0;answers=[]}render()});const h=document.getElementById('hamb');if(h)h.onclick=()=>{menu=!menu;render()};document.querySelectorAll('[data-opt]').forEach((b,i)=>b.onclick=()=>{answers[step]=qs[step].o[i][0];render()});const back=document.getElementById('back');if(back)back.onclick=()=>{if(step===0)view='home';else step--;render()};const next=document.getElementById('next');if(next)next.onclick=()=>{if(answers[step]){step++;render()}};document.querySelectorAll('[data-phone]').forEach(b=>b.onclick=()=>{view='process';render()});const status=document.getElementById('status');if(status)status.onclick=()=>{const order=['Nuevo','Contactar','En seguimiento','Solicitud','Convertido'];leadStatus=order[(order.indexOf(leadStatus)+1)%order.length];render()}}render();</script></body></html>
